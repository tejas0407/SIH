# Always-on deployment for a single Ubuntu VM (runs live on Azure for Students;
# nothing here is provider-specific).
#
#   app    the single-container image from deploy/all-in-one/Dockerfile: PostGIS,
#          Redis, MinIO, backend, Celery worker and frontend behind nginx:7860
#   caddy  public HTTPS on 80/443 with an automatic Let's Encrypt certificate
#
# deploy/vm/setup.sh writes the .env next to this file and starts it.

name: bhu-validate

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/all-in-one/Dockerfile
    image: bhu-validate:latest
    restart: always
    environment:
      # Presigned scan URLs are signed against the public host.
      PUBLIC_HOST: ${PUBLIC_HOST}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AADHAAR_HASH_SALT: ${AADHAAR_HASH_SALT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      # Database, object store and seed marker survive restarts and rebuilds.
      - appdata:/home/user/data
      - modelcache:/home/user/.cache

  caddy:
    image: caddy:2
    restart: always
    command: caddy reverse-proxy --from ${PUBLIC_HOST} --to app:7860
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddydata:/data
    depends_on:
      - app

volumes:
  appdata:
  modelcache:
  caddydata:
