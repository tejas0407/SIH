[project]
name = "dilrmp-land-records"
version = "1.0.0"
description = "Intelligent Land Record Digitization and Validation System (SIH26018)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
