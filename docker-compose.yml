# Local development stack for SIH26018 — every service in its own container.
#   cp .env.example .env && docker compose up --build
# Nothing here reaches a paid or third-party API: OCR, storage, queue and
# database all run locally.

name: dilrmp-land-records

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: dilrmp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dilrmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dilrmp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-land_records}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations run once, on an empty data directory.
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dilrmp} -d ${POSTGRES_DB:-land_records}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dilrmp_redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object store for scans and previews. MinIO no longer
  # publishes free images, so this is SeaweedFS, which speaks the same S3 API
  # the backend's MinIO client uses. The backend creates the buckets at boot.
  objectstore:
    image: chrislusf/seaweedfs:4.48
    container_name: dilrmp_objectstore
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256 -volume.max=100
    volumes:
      - objectdata:/data
    ports:
      - "9000:9000"   # S3 API (presigned scan URLs open from the browser)
    healthcheck:
      # Any HTTP answer (403 without credentials) means S3 is serving.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000/"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: dilrmp_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: objectstore:9000
      # Presigned URLs are opened by the reviewer's browser, which cannot
      # resolve the compose network, so they are signed against localhost.
      MINIO_PUBLIC_ENDPOINT: localhost:9000
    volumes:
      - ./backend:/app
      - model_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
    container_name: dilrmp_worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2 -Q ingestion
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: objectstore:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
    volumes:
      - ./backend:/app
      - model_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
    container_name: dilrmp_frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  objectdata:
  model_cache:
