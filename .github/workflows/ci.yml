name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System packages
        # Devanagari fonts for the synthetic scan generator the tests render with.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-lohit-deva poppler-utils
      - name: Python packages
        # The suite needs no OCR model, so skip the multi-GB model frameworks.
        run: |
          grep -viE '^(paddleocr|paddlepaddle|torch|transformers)==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
      - name: pytest
        run: pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: /api/v1
          NEXT_TELEMETRY_DISABLED: 1
