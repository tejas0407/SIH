[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:postgres]
command=postgres -D %(ENV_DATA_DIR)s/pg -c listen_addresses=127.0.0.1 -c unix_socket_directories=/tmp
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --dir %(ENV_DATA_DIR)s/redis --appendonly yes
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; S3 API on 127.0.0.1:9000 (same address MinIO used); the master, volume and
; filer ports it also opens are bound to loopback too. Keys come from
; /tmp/s3.json, written by start.sh.
[program:objectstore]
command=weed server -ip=127.0.0.1 -ip.bind=127.0.0.1 -dir=%(ENV_DATA_DIR)s/objects -s3 -s3.port=9000 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256 -volume.max=100
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Creates the database, applies the schema and loads the demo records, then exits.
[program:bootstrap]
command=/opt/app/bootstrap.sh
directory=/app
priority=20
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backend]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips=*
directory=/app
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:celery_worker]
command=celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2 -Q ingestion
directory=/app
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:frontend]
command=node server.js
directory=/frontend
environment=PORT="3000",HOSTNAME="127.0.0.1",NODE_ENV="production"
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -c /opt/app/nginx.conf -g "daemon off;"
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
