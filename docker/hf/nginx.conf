# Runs as the unprivileged Space user, so every path nginx writes to is under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log off;
  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  # Upload limit shown in the console is 50 MB.
  client_max_body_size 60m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 7860;

    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 300s;
    }

    location = /health {
      proxy_pass http://127.0.0.1:8000;
    }

    # Presigned scan URLs are signed against the Space's public host, so the
    # Host header must reach MinIO unchanged or the signature check fails.
    location ~ ^/(raw-scans|processed-tiles|signed-certificates)/ {
      proxy_pass http://127.0.0.1:9000;
      proxy_set_header Host $http_host;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
