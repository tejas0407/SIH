# Complete offline stack for SIH26018.
#   docker compose -f docker/docker-compose.yml --env-file ../.env up --build
# Nothing here reaches a paid or third-party API: OCR, storage, queue and
# database all run locally.

name: dilrmp-land-records

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: dilrmp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dilrmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dilrmp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-land_records}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations run once, on an empty data directory.
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dilrmp} -d ${POSTGRES_DB:-land_records}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dilrmp_redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: dilrmp_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 6s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Creates the three buckets and exits. Everything that needs them waits on it.
  minio_init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: dilrmp_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_RAW:-raw-scans} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_TILES:-processed-tiles} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_CERTS:-signed-certificates} &&
      echo 'buckets ready'
      "

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: dilrmp_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      # Presigned URLs are opened by the reviewer's browser, which cannot
      # resolve the compose network, so they are signed against localhost.
      MINIO_PUBLIC_ENDPOINT: localhost:9000
    volumes:
      - ../backend:/app
      - model_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  celery_worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: dilrmp_worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2 -Q ingestion
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
    volumes:
      - ../backend:/app
      - model_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
    container_name: dilrmp_frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  model_cache:
